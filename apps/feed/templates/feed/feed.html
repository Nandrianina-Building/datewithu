{% extends "base.html" %}
{% load icons %}

{% block title %}Le Fil — Date With U{% endblock %}

{% block content %}
<div class="feed-page">
    <header class="feed-page-heading">
        <div>
            <p class="page-eyebrow">Communauté</p>
            <h1>{% icon "sparkles" %} Le Fil</h1>
            <p>Des idées de sorties partagées par la communauté.</p>
        </div>
        <button type="button" class="btn btn-primary" id="feed-open-composer-btn">{% icon "plus" %} Publier une idée</button>
    </header>

    <div id="feed-list" class="feed-list">
        <div class="skeleton-date-card" aria-hidden="true"><span class="skeleton-cover"></span><span class="skeleton-bar skeleton-bar--long"></span><span class="skeleton-bar skeleton-bar--short"></span></div>
        <div class="skeleton-date-card" aria-hidden="true"><span class="skeleton-cover"></span><span class="skeleton-bar skeleton-bar--medium"></span><span class="skeleton-bar skeleton-bar--short"></span></div>
    </div>
    <div id="feed-more-row" style="text-align:center;margin-top:1rem;"></div>
</div>
{% endblock %}

{% block extra_js %}
{% load static %}
<script src="{% static 'js/feed.js' %}"></script>
{% endblock %}
