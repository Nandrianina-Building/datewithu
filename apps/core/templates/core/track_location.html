{% extends "base.html" %}
{% load icons %}

{% block title %}Suivi en direct — Date With U{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}

{% block content %}
<header class="compact-page-heading">
    <h1>{% icon "map-pin" %} Suivi en direct</h1>
    <p id="track-subtitle"><span class="skeleton-bar skeleton-bar--medium" aria-label="Chargement du suivi"></span></p>
</header>

<div id="track-status" class="card skeleton-stack" style="max-width:520px;margin-bottom:1rem;" aria-label="Chargement du statut">
    <span class="skeleton-bar skeleton-bar--long" aria-hidden="true"></span>
</div>
<div class="map-loading-frame map-loading-frame--track">
    <div id="track-map" style="height:420px;border-radius:var(--radius-lg);overflow:hidden;">
        <div id="track-map-skeleton" class="skeleton-map" aria-label="Chargement de la carte">
            <span class="skeleton-bar skeleton-bar--medium" aria-hidden="true"></span>
            <span class="skeleton-bar skeleton-bar--long" aria-hidden="true"></span>
            <span class="skeleton-bar skeleton-bar--short" aria-hidden="true"></span>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% load static %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.DWU_TRACK_TOKEN = "{{ token }}";</script>
<script src="{% static 'js/track-location.js' %}?v=2"></script>
{% endblock %}
