{% extends "base.html" %}
{% load icons %}

{% block title %}Mot de passe changé — Date With U{% endblock %}

{% block content %}
<div class="auth-status-card">
    <div class="verify-icon">{% icon "check-circle" "icon-xl" %}</div>
    <h1>Mot de passe mis à jour</h1>
    <p>Ton mot de passe a bien été changé.</p>
    <div class="auth-status-actions">
        <a class="btn btn-primary" href="{% url 'accounts:profile' %}">Retour à mon profil</a>
    </div>
</div>
{% endblock %}
